name: CMake on multiple platforms and publish to PYPI and NPM

on:
  push:
    tags: [ "*" ]
    branches-ignore: [ "main" ]
    paths:
      - 'CMakeLists.txt'
      - '.github/workflows/build.yml'
      - 'tests/**'
      - 'rm_lines/**'
      - 'rm_lines_sys/**'
      - 'rm_lines_wasm_sys/**'
      - 'requirements.txt'
      - 'tools/**'
  pull_request:
    branches: [ "main", "experimental" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sys:
    name: ${{ matrix.runner }} ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    env:
      SCCACHE_GHA_ENABLED: 'true'

    strategy:
      fail-fast: true
      matrix:
        include:
          - os: 'ubuntu'
            runner: 'ubuntu-latest'
            target: 'x86_64-unknown-linux-gnu'
            cpp_compiler: 'g++'
            c_compiler: 'gcc'
            build_type: 'Release'
            run_tests: true
            build_wheel: true

          - os: 'ubuntu'
            runner: 'ubuntu-24.04-arm'
            target: 'aarch64-unknown-linux-gnu'
            cpp_compiler: 'g++'
            c_compiler: 'gcc'
            build_type: 'Release'
            run_tests: true
            build_wheel: true

          - os: 'windows'
            runner: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            cmake_platform: 'x64'
            build_type: 'Release'
            run_tests: true
            build_wheel: true

          - os: 'windows'
            runner: 'windows-11-arm'
            target: 'aarch64-pc-windows-msvc'
            cmake_platform: 'ARM64'
            build_type: 'Release'
            run_tests: true
            build_wheel: true

          - os: 'macos'
            runner: 'macos-15-intel'
            target: 'x86_64-apple-darwin'
            cpp_compiler: 'clang++'
            c_compiler: 'clang'
            build_type: 'Release'
            run_tests: true
            build_wheel: true

          - os: 'macos'
            runner: 'macos-15'
            target: 'aarch64-apple-darwin'
            cpp_compiler: 'clang++'
            c_compiler: 'clang'
            build_type: 'Release'
            run_tests: true
            build_wheel: true
    steps:
      - uses: actions/checkout@v6

      - name: Fetch tags for current commit
        run: git fetch --tags --depth=1

      - name: Set reusable strings
        # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache CMake dependencies (FetchContent)
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cache/cmake
          key: ${{ runner.os }}-${{ matrix.target }}-cmake-deps-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cmake-deps-

      - name: Cache CMake build files
        uses: actions/cache@v6
        with:
          path: ${{ steps.strings.outputs.build-output-dir }}
          key: ${{ runner.os }}-${{ matrix.target }}-cmake-${{ matrix.cpp_compiler || matrix.cmake_platform }}-${{ matrix.c_compiler || matrix.cmake_platform }}-${{ github.ref_name }}-${{ hashFiles('**/CMakeLists.txt', 'rm_lines/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cmake-${{ matrix.cpp_compiler || matrix.cmake_platform }}-${{ matrix.c_compiler || matrix.cmake_platform }}-${{ github.ref_name }}-
            ${{ runner.os }}-${{ matrix.target }}-cmake-${{ matrix.cpp_compiler || matrix.cmake_platform }}-${{ matrix.c_compiler || matrix.cmake_platform }}-

      - name: Configure CMake
        shell: bash
        run: |
          BUILD_DIR="${{ steps.strings.outputs.build-output-dir }}"
          SOURCE_DIR="${{ github.workspace }}"
          FETCHCONTENT_DIR="${{ github.workspace }}/.cache/cmake"

          BUILD_DIR="${BUILD_DIR//\\//}"
          SOURCE_DIR="${SOURCE_DIR//\\//}"
          FETCHCONTENT_DIR="${FETCHCONTENT_DIR//\\//}"

          CMAKE_CMD=(cmake -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" -DFETCHCONTENT_BASE_DIR="$FETCHCONTENT_DIR")

          if [ "${{ runner.os }}" = "Windows" ]; then
            CMAKE_CMD+=(-A "${{ matrix.cmake_platform }}" -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_C_COMPILER_LAUNCHER=sccache)
          else
            CMAKE_CMD+=(-DCMAKE_CXX_COMPILER="${{ matrix.cpp_compiler }}" -DCMAKE_C_COMPILER="${{ matrix.c_compiler }}" -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_C_COMPILER_LAUNCHER=sccache)
          fi
          
          "${CMAKE_CMD[@]}" -S "$SOURCE_DIR"

      - name: Build
        # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --target rm_lines

      - name: Show sccache statistics
        shell: bash
        run: |
          "${SCCACHE_PATH}" --show-stats

      - name: Update version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == "refs/tags/"* ]]; then
            # Check if there is a tag on the current commit
            tag=$(git tag --points-at HEAD | head -n 1)
            if [[ -n "$tag" ]]; then
              echo "Tag found: $tag"
              version="${tag}"
            else
              echo "Failed to get tag, using dev"
              version="0.0.0.dev"
            fi
          else
            echo "Not on tagged commit, using dev"
            version="0.0.0.dev"
          fi
          echo "Version: $version"
          echo "version=${version}" >> "$GITHUB_ENV"
          sed -i -e "s|0.0.0+replaced-by-ci|${version}|g" rm_lines_sys/pyproject.toml

      - name: Run test & copy shared library to sys
        if: matrix.run_tests
        shell: bash
        run: |
          cd tests
          python test.py

      - name: Check sys bindings match exports
        shell: bash
        run: |
          python tools/check_sys_exports.py

      - name: Build with poetry
        if: matrix.build_wheel
        shell: bash
        run: |
          cd rm_lines_sys
          poetry build -f wheel

      - name: Gather files into temp dir
        shell: bash
        run: |
          mkdir -p artifact
          if [[ "${{ matrix.build_wheel }}" == "true" ]]; then
            mv rm_lines_sys/dist/*.whl artifact/
          fi
          
          case "${{ matrix.os }}" in
            ubuntu*)
              mv "${{ steps.strings.outputs.build-output-dir }}/librm_lines.so" artifact/
              ;;
            macos*)
              mv "${{ steps.strings.outputs.build-output-dir }}/librm_lines.dylib" artifact/
              ;;
            windows*)
              mv "${{ steps.strings.outputs.build-output-dir }}/${{ matrix.build_type }}/rm_lines.dll" artifact/
              ;;
          esac

      - name: Rename wheel to be Python-agnostic
        if: matrix.build_wheel
        shell: bash
        run: |
          file=$(ls artifact/*.whl)
          new_name=$(python -c "import sys, re; print(re.sub(r'cp3\d+-cp3\d+', 'py3-none', sys.argv[1]))" "$file")
          mv "$file" "$new_name"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.runner }}-${{ matrix.target }}
          path: |
            artifact/*.whl
            artifact/librm_lines.so
            artifact/librm_lines.dylib
            artifact/rm_lines.dll
          retention-days: 5

  build-web:
    name: Build for Emscripten web
    runs-on: ubuntu-latest
    env:
      EM_VERSION: 5.0.1
      EM_CACHE_FOLDER: 'emsdk-cache'

    steps:
      - uses: actions/checkout@v6

      - name: Setup cache
        id: cache-system-libraries
        uses: actions/cache@v5
        with:
          path: ${{env.EM_CACHE_FOLDER}}
          key: ${{env.EM_VERSION}}-${{ runner.os }}

      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: ${{env.EM_VERSION}}
          actions-cache-folder: ${{env.EM_CACHE_FOLDER}}

      - name: Verify emsdk installation
        run: emcc -v

      - name: Fetch tags for current commit
        run: git fetch --tags --depth=1

      - name: Set reusable strings
        # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build-web" >> "$GITHUB_OUTPUT"

      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache CMake dependencies (FetchContent)
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cache/cmake
          key: linux-wasm-cmake-deps-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            linux-wasm-cmake-deps-

      - name: Cache CMake build files
        uses: actions/cache@v6
        with:
          path: ${{ steps.strings.outputs.build-output-dir }}
          key: linux-wasm-emscripten-${{ github.ref_name }}-${{ hashFiles('**/CMakeLists.txt', 'rm_lines/**', 'rm_lines_wasm_sys/**') }}
          restore-keys: |
            linux-wasm-emscripten-${{ github.ref_name }}-
            linux-wasm-emscripten-

      - name: Check sys bindings match exports
        shell: bash
        run: |
          python tools/check_sys_exports.py

      - name: Configure CMake
        run: >
          emcmake cmake -B ${{ steps.strings.outputs.build-output-dir }} 
          -DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/.cache/cmake
          -S ${{ github.workspace }}

      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --target rm_lines_wasm

      - name: Show build cache
        shell: bash
        run: |
          echo "Build directory size:"
          du -sh "${{ steps.strings.outputs.build-output-dir }}" || true

      - name: Gather files into temp dir
        shell: bash
        run: |
          mkdir -p artifact
          mv "${{ steps.strings.outputs.build-output-dir }}/rm_lines_wasm.js" artifact/
          mv "${{ steps.strings.outputs.build-output-dir }}/rm_lines_wasm.wasm" artifact/
          mv "${{ steps.strings.outputs.build-output-dir }}/rm_lines_wasm.wasm.map" artifact/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: web
          path: |
            artifact/rm_lines_wasm.*
          retention-days: 5

  verify-npm-arch:
    name: Verify NPM package on ${{ matrix.arch }}
    needs: build-web
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - uses: actions/checkout@v6

      - name: Download all the dists
        uses: actions/download-artifact@v6
        with:
          path: artifacts/

      - name: Assemble sys package
        shell: bash
        run: |
          set -euo pipefail

          SYS_DIR="rm_lines_wasm_sys"
          mkdir -p "$SYS_DIR"

          find artifacts -type f \( \
            -name "rm_lines_wasm.js" -o \
            -name "rm_lines_wasm.wasm" -o \
            -name "rm_lines_wasm.wasm.map" \
          \) -exec cp {} "$SYS_DIR/" \;

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate NPM pack output
        shell: bash
        working-directory: rm_lines_wasm_sys
        run: |
          set -euo pipefail
          npm pkg get name
          npm pkg get version
          npm pack --dry-run

  create-release:
    name: Create Release
    needs:
      - build-sys
      - build-web
      - verify-npm-arch
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts/

      - name: Create Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Lib rMLines Release ${{ github.ref_name }}
          body: |
            Release ${{ github.ref_name }}

            Commit: `${{ github.sha }}`
            Run: #${{ github.run_number }}
          files: artifacts/**/*
          draft: false
          prerelease: true

      - name: Create Draft Release
        if: github.ref_type != 'tag'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Lib rMLines Draft Release ${{ github.ref_name }}
          body: |
            Release ${{ github.ref_name }}

            Commit: `${{ github.sha }}`
            Run: #${{ github.run_number }}
          files: artifacts/**/*
          draft: true
          prerelease: false

  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    if: startsWith(github.ref, 'refs/tags/')  # only publish to PyPI on tag pushes
    needs:
      - build-sys
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rm_lines_sys
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v6
        with:
          path: artifacts/
      - name: Move wheels to dist
        shell: bash
        run: |
          mkdir -p dist
          find artifacts -type f -name "*.whl" -exec mv {} dist/ \;
      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-to-npm:
    name: >-
      Publish Sys Package to NPM
    if: startsWith(github.ref, 'refs/tags/')  # only publish to NPM on tag pushes
    needs:
      - build-web
      - verify-npm-arch
    runs-on: ubuntu-latest
    environment:
      name: npm
    permissions:
      contents: read
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
      - uses: actions/checkout@v6
      - name: Download all the dists
        uses: actions/download-artifact@v6
        with:
          path: artifacts/

      - name: Assemble sys package
        shell: bash
        run: |
          set -euo pipefail

          SYS_DIR="rm_lines_wasm_sys"

          # ensure clean state
          mkdir -p "$SYS_DIR"

          # copy wasm artifacts safely
          find artifacts -type f \( \
            -name "rm_lines_wasm.js" -o \
            -name "rm_lines_wasm.wasm" -o \
            -name "rm_lines_wasm.wasm.map" \
          \) -exec cp {} "$SYS_DIR/" \;

          ls -R "$SYS_DIR"

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"   # v1.3.5 -> 1.3.5
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Sync package.json version
        shell: bash
        run: |
          cd rm_lines_wasm_sys
          npm version "${{ steps.version.outputs.VERSION }}" --no-git-tag-version

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Publish to npm (trusted publishing)
        working-directory: rm_lines_wasm_sys
        run: |
          set -euo pipefail
          npm pkg get name
          npm pkg get version
          npm publish --provenance --access public

